name: Java CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: trophy_buddy_spring_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trophy_buddy_spring_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JDBC_DATABASE_URL: jdbc:postgresql://localhost:5432/trophy_buddy_spring_test
      DB_USER: postgres
      DB_PASSWORD: ci-postgres
      FLYWAY_ENABLED: 'true'
      TROPHY_VERIFY_WRITES: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress verify
