spring.application.name=trophy-buddy-api-spring
server.address=127.0.0.1
server.port=${PORT:8081}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/trophy_buddy_spring}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
logging.structured.format.console=ecs
trophybuddy.firebase.project-id=${FIREBASE_PROJECT_ID:}
trophybuddy.cors.origins=${CORS_ORIGINS:http://localhost:3000}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.flyway.enabled=${FLYWAY_ENABLED:false}

springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
